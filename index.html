<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>WrapBridge — Find &amp; Book Vehicle Wrap, Tint &amp; Detailing Shops</title>
    <meta name="description" content="WrapBridge connects you with the best vehicle wrap, window tint, and detailing shops near you. Compare portfolios, get quotes, and book online." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://wrapbridge.com/" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WrapBridge" />
    <meta property="og:title" content="WrapBridge — Find &amp; Book Vehicle Wrap, Tint &amp; Detailing Shops" />
    <meta property="og:description" content="WrapBridge connects you with the best vehicle wrap, window tint, and detailing shops near you. Compare portfolios, get quotes, and book online." />
    <meta property="og:url" content="https://wrapbridge.com/" />
    <meta property="og:image" content="https://wrapbridge.com/images/Logo.png" />
    <meta property="og:image:alt" content="WrapBridge — Vehicle Wrap &amp; Tint Booking Platform" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@wrapbridge" />
    <meta name="twitter:title" content="WrapBridge — Find &amp; Book Vehicle Wrap, Tint &amp; Detailing Shops" />
    <meta name="twitter:description" content="WrapBridge connects you with the best vehicle wrap, window tint, and detailing shops near you. Compare portfolios, get quotes, and book online." />
    <meta name="twitter:image" content="https://wrapbridge.com/images/Logo.png" />
    <meta name="twitter:image:alt" content="WrapBridge — Vehicle Wrap &amp; Tint Booking Platform" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "WrapBridge",
      "url": "https://wrapbridge.com",
      "description": "WrapBridge is a booking marketplace that connects customers with vehicle wrap, window tint, PPF, and detailing shops.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://wrapbridge.com/#search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
